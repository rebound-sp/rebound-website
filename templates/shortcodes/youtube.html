<figure class="peertube">
    <figcaption><p><strong><em>{{titre}}</em></strong> ({{auteur}})</p></figcaption>
    <iframe
        class="peertube" title="{{title}}" 
        src="https://www.youtube.com/embed/{{id}}{% if autoplay %}?autoplay=1{% endif %}"
        width="560" height="315" 
        webkitallowfullscreen
        mozallowfullscreen
        allowfullscreen>
    </iframe>
</figure>
